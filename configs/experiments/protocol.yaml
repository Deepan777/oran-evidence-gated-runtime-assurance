schema_version: 1
methodology_version: "1.0"
window_seconds: 1
run_length_seconds: 120
phases_seconds:
  pre_jam: 20
  jammer_on: 80
  recovery: 20
jammer_types: [none, barrage, partial_band, sweep, intermittent, reactive]
jsr_db: [-5, 0, 5, 10]
traffic_load: [low, medium, high]
service_mix: [protected_only, protected_plus_background]
attenuation: [nominal, degraded]
seeds: [1001, 1002, 1003, 1004, 1005, 1006, 1007, 1008, 1009, 1010,
        1011, 1012, 1013, 1014, 1015, 1016, 1017, 1018, 1019, 1020]
traffic_mbps:
  low: {protected: 0.3, background: 2.1}
  medium: {protected: 0.6, background: 4.2}
  high: {protected: 0.9, background: 6.3}
attenuation_db: {nominal: 0.0, degraded: 6.0}
pilot:
  seeds: [1001, 1002]
  jammer_types: [none, barrage, partial_band, intermittent, reactive]
  jsr_db: [0, 5]
  traffic_load: [low, high]
  service_mix: [protected_only, protected_plus_background]
  attenuation: [nominal, degraded]
  run_length_seconds: 30
  phases_seconds: {pre_jam: 5, jammer_on: 20, recovery: 5}
generalization_holdouts:
  - {jammer_type: sweep, jsr_db: 5, traffic_load: high, attenuation: degraded}
  - {jammer_type: intermittent, jsr_db: 10, traffic_load: medium, attenuation: nominal}
  - {jammer_type: reactive, jsr_db: 0, traffic_load: high, attenuation: nominal}
