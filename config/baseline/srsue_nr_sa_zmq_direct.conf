# Pinned srsUE direct-link diagnostic configuration.
# This is identical to the transparent-proxy profile except that the UE talks
# directly to the gNB ZeroMQ endpoints. It is used only to establish that the
# immutable radio/core baseline registers before measuring proxy throughput.
[rf]
freq_offset = 0
tx_gain = 50
rx_gain = 40
srate = 23.04e6
nof_antennas = 1
continuous_tx = yes
device_name = zmq
device_args = tx_port=tcp://*:2001,rx_port=tcp://127.0.0.1:2000,base_srate=23.04e6

[rat.eutra]
dl_earfcn = 2850
nof_carriers = 0

[rat.nr]
bands = 3
nof_carriers = 1
max_nof_prb = 106
nof_prb = 106

[pcap]
enable = mac_nr,nas
mac_filename = /evidence/srsue_mac.pcap
mac_nr_filename = /evidence/srsue_mac_nr.pcap
nas_filename = /evidence/srsue_nas.pcap

[log]
all_level = info
phy_lib_level = none
all_hex_limit = 32
filename = /evidence/srsue.log
file_max_size = -1

[usim]
mode = soft
algo = milenage
opc = REPLACE_WITH_YOUR_TESTBED_OPC
k = REPLACE_WITH_YOUR_TESTBED_K
imsi = REPLACE_WITH_YOUR_TESTBED_IMSI
imei = REPLACE_WITH_YOUR_TESTBED_IMEI

[rrc]
ue_category = 4
release = 15

[nas]
apn = internet
apn_protocol = ipv4
force_imsi_attach = true

[slicing]
enable = true
nssai-sst = 1
nssai-sd = 1

[gw]
ip_devname = tun_srsue
ip_netmask = 255.255.255.0

[gui]
enable = false

[general]
metrics_period_secs = 1
metrics_csv_enable = true
metrics_csv_filename = /evidence/srsue_metrics.csv
metrics_csv_append = false
metrics_csv_flush_period_sec = 1
