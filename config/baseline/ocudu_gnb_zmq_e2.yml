# Pinned baseline: OCUDU fa4c9fa445a37fea681c9a75ee2fc70f9814ae06
# 5G SA over ZeroMQ to pinned srsUE, with O-RAN E2 KPM and RC enabled.
cu_cp:
  # Keep the UE/PDU session alive for the complete bounded experiment. The
  # native OCUDU default is 120 s wall time, which is too short when virtual
  # radio time is intentionally paced below real time during a live run.
  # 7200 s is the documented maximum accepted by the OCUDU configuration.
  inactivity_timer: 7200
  amf:
    addrs: 127.0.0.5
    port: 38412
    bind_addrs: 127.0.0.1
    supported_tracking_areas:
      - tac: 7
        plmn_list:
          - plmn: "00101"
            tai_slice_support_list:
              - sst: 1
                sd: 1

ru_sdr:
  device_driver: zmq
  device_args: tx_port=tcp://127.0.0.1:2000,rx_port=tcp://127.0.0.1:2001,base_srate=23.04e6
  srate: 23.04
  # OCUDU's ZMQ radio validates gains as attenuation and requires <= 0 dB.
  tx_gain: 0
  rx_gain: 0

cell_cfg:
  dl_arfcn: 368500
  band: 3
  channel_bandwidth_MHz: 20
  common_scs: 15
  plmn: "00101"
  tac: 7
  # Configure the protected S-NSSAI in the live scheduler, not only in the
  # AMF-advertised tracking area. This enables reversible A3 quota updates.
  slicing:
    - sst: 1
      sd: 1
      sched_cfg:
        min_prb_policy_ratio: 10
        max_prb_policy_ratio: 100
        ded_prb_policy_ratio: 1
  pdcch:
    dedicated:
      ss2_type: common
      dci_format_0_1_and_1_1: false
    common:
      ss0_index: 0
      coreset0_index: 12
  prach:
    prach_config_index: 1
  pdsch:
    mcs_table: qam64
    # The pinned native MAC otherwise releases the UE after 100 consecutive
    # HARQ failures.  During a deliberately strong jammer interval that ends
    # a run before the planned recovery phase can be observed. Keep the
    # connection alive (without changing payload, jammer, or telemetry) so
    # the full controlled fault-and-recovery trajectory is recorded.
    # Multiple HARQ outcomes can be counted in one 1 ms slot.  The previous
    # 100k guard was exhausted after about 20 radio-seconds in the locked
    # barrage row.  Ten million is above the bounded 120 s experiment's
    # possible count and lets the post-jammer recovery phase be observed.
    max_consecutive_kos: 10000000
  pusch:
    mcs_table: qam64
    max_consecutive_kos: 10000000
  pucch:
    max_consecutive_kos: 10000000

e2:
  enable_du_e2: true
  # The pinned FlexRIC near-RT RIC runs on the VM host network.  Keeping E2
  # local avoids an unused minikube NodePort whose connection retries blocked
  # the software-radio thread and created non-RF stalls during long runs.
  addrs: 127.0.0.1
  bind_addrs: 127.0.0.1
  port: 36421
  e2sm_kpm_enabled: true
  e2sm_rc_enabled: true

# Native reports are emitted every 100 ms of radio time and the research
  # collector aggregates only observed reports into non-overlapping 1 s
# radio-clock windows. Ten native reports per decision window preserve direct
# DU/RLC observation while avoiding the excessive CPU pressure of 10 ms
# reporting on this two-vCPU research VM.
# Both the human-readable and JSON consumers are enabled so the raw report can
# be retained while the JSON stream is parsed without scraping formatted text.
metrics:
  autostart_stdout_metrics: true
  enable_log: true
  enable_json: true
  # Keep machine-readable DU/RLC/MAC reports for the one-second evidence
  # windows without flooding the real-time gNB thread with verbose stdout.
  enable_verbose: false
  periodicity:
    du_report_period: 100
  layers:
    enable_sched: true
    enable_sched_ue: true
    enable_rlc: true
    enable_mac: true

remote_control:
  enabled: true
  bind_addr: 127.0.0.1
  port: 8001

log:
  # Writing the verbose SIB1 record directly to the bind-mounted evidence file
  # can stall this OCUDU build. Docker captures stdout reliably; the trial
  # runner archives that output as gnb.log after each run.
  filename: stdout
  # Verbose per-PDU logging can starve the ZMQ RF thread on a software radio
  # VM and create false RF-overflow failures. Structured metrics and pcaps
  # remain enabled below; only diagnostic stdout is reduced.
  all_level: warning
  e2ap_level: warning
  hex_max_size: 0

pcap:
  mac_enable: enable
  mac_filename: /evidence/gnb_mac.pcap
  ngap_enable: enable
  ngap_filename: /evidence/gnb_ngap.pcap
