# Pinned baseline: OCUDU fa4c9fa445a37fea681c9a75ee2fc70f9814ae06
# V4 live-validation profile: real-IQ UDP service over a method-neutral RLC UM
# bearer. The rejected V3 RLC-AM evidence remains immutable. RLC UM is used
# because UDP packet loss is an experimental outcome; an AM retry-limit
# release would instead terminate the software-radio clock and censor the
# planned recovery interval. No jammer, traffic, duration, seed, attenuation,
# action, model, telemetry, or synthetic-frame setting is changed.
cu_cp:
  inactivity_timer: 7200
  amf:
    addrs: 127.0.0.5
    port: 38412
    bind_addrs: 127.0.0.1
    supported_tracking_areas:
      - tac: 7
        plmn_list:
          - plmn: "00101"
            tai_slice_support_list:
              - sst: 1
                sd: 1

ru_sdr:
  device_driver: zmq
  device_args: tx_port=tcp://127.0.0.1:2000,rx_port=tcp://127.0.0.1:2001,base_srate=23.04e6
  srate: 23.04
  tx_gain: 0
  rx_gain: 0

cell_cfg:
  dl_arfcn: 368500
  band: 3
  channel_bandwidth_MHz: 20
  common_scs: 15
  plmn: "00101"
  tac: 7
  slicing:
    - sst: 1
      sd: 1
      sched_cfg:
        min_prb_policy_ratio: 10
        max_prb_policy_ratio: 100
        ded_prb_policy_ratio: 1
  pdcch:
    dedicated:
      ss2_type: common
      dci_format_0_1_and_1_1: false
    common:
      ss0_index: 0
      coreset0_index: 12
  prach:
    prach_config_index: 1
  pdsch:
    mcs_table: qam64
    max_consecutive_kos: 10000000
  pusch:
    mcs_table: qam64
    max_consecutive_kos: 10000000
  pucch:
    max_consecutive_kos: 10000000

# The Open5GS subscriber/session uses non-GBR 5QI 9. Preserve its PDCP,
# buffering, and reordering parameters while changing only RLC AM to the
# standards-supported bidirectional UM mode used for loss-tolerant UDP.
qos:
  - five_qi: 9
    pdcp:
      tx:
        sn: 18
        discard_timer: 1500
        status_report_required: false
      rx:
        sn: 18
        t_reordering: 220
        out_of_order_delivery: false
    f1u_cu_up:
      backoff_timer: 5
    f1u_du:
      backoff_timer: 5
    rlc:
      mode: um-bidir
      um-bidir:
        tx:
          sn: 12
          queue-size: 16384
          queue-bytes: 6172672
        rx:
          sn: 12
          t-reassembly: 20

e2:
  enable_du_e2: true
  addrs: 127.0.0.1
  bind_addrs: 127.0.0.1
  port: 36421
  e2sm_kpm_enabled: true
  e2sm_rc_enabled: true

metrics:
  autostart_stdout_metrics: true
  enable_log: true
  enable_json: true
  enable_verbose: false
  periodicity:
    du_report_period: 100
  layers:
    enable_sched: true
    enable_sched_ue: true
    enable_rlc: true
    enable_mac: true

remote_control:
  enabled: true
  bind_addr: 127.0.0.1
  port: 8001

log:
  filename: stdout
  all_level: warning
  e2ap_level: warning
  hex_max_size: 0

pcap:
  mac_enable: enable
  mac_filename: /evidence/gnb_mac.pcap
  ngap_enable: enable
  ngap_filename: /evidence/gnb_ngap.pcap
