# OCUDU/srsUE ZMQ configuration with a transparent downlink IQ proxy.
# The UE sends normal REQ messages to the proxy at :2002; the proxy forwards
# them to OCUDU's REP transmitter at :2000 and returns altered complex IQ.
[rf]
freq_offset = 0
tx_gain = 50
rx_gain = 40
srate = 23.04e6
nof_antennas = 1
# Required for this VM's software-radio scheduling path: keep the ZMQ uplink
# request stream active so that the gNB has a peer clock. This changes neither
# jammer semantics nor any controller method.
continuous_tx = yes
device_name = zmq
device_args = tx_port=tcp://0.0.0.0:2003,rx_port=tcp://host.docker.internal:2002,base_srate=23.04e6

[rat.eutra]
dl_earfcn = 2850
nof_carriers = 0

[rat.nr]
bands = 3
nof_carriers = 1
max_nof_prb = 106
nof_prb = 106

[pcap]
enable = mac_nr,nas
mac_filename = /evidence/srsue_mac.pcap
mac_nr_filename = /evidence/srsue_mac_nr.pcap
nas_filename = /evidence/srsue_nas.pcap

[log]
# Per-PDU INFO output writes tens of megabytes during a short software-radio
# run and can starve the UE PHY thread that services the ZMQ clock.  The
# methodology evidence comes from the native 1 s metrics CSV plus MAC/NAS
# pcaps, so production trials keep only warnings and errors here.
all_level = warning
phy_lib_level = none
all_hex_limit = 32
filename = /evidence/srsue.log
file_max_size = -1

[usim]
mode = soft
algo = milenage
opc = REPLACE_WITH_YOUR_TESTBED_OPC
k = REPLACE_WITH_YOUR_TESTBED_K
imsi = REPLACE_WITH_YOUR_TESTBED_IMSI
imei = REPLACE_WITH_YOUR_TESTBED_IMEI

[rrc]
ue_category = 4
release = 15

[nas]
apn = internet
apn_protocol = ipv4
force_imsi_attach = true

[slicing]
enable = true
nssai-sst = 1
nssai-sd = 1

[gw]
ip_devname = tun_srsue
ip_netmask = 255.255.255.0

[gui]
enable = false

[general]
# One independently timestamped UE report per locked 1 s decision window.
# The pinned srsUE CSV exporter provides receiver-side RSRP, RSRQ, RSSI,
# SINR, BLER, throughput, MCS, and queue measurements from the live PHY/MAC.
metrics_period_secs = 1
metrics_csv_enable = true
metrics_csv_filename = /evidence/srsue_metrics.csv
metrics_csv_append = false
metrics_csv_flush_period_sec = 1
